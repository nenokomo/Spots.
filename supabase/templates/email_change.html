<!-- Betreff: Bitte bestätige deine neue E-Mail-Adresse -->

  <div style="max-width:480px;margin:0 auto;background:#16141a;border-radius:20px;padding:32px 28px">
    <p style="margin:0 0 24px;font-size:22px;font-weight:800;letter-spacing:-0.02em">Spots</p>

    <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c922ab;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 22px;border-radius:12px">Änderung bestätigen</a></p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#8d8896">Wenn du die Änderung nicht angefordert hast, ignoriere diese E-Mail und ändere zur Sicherheit dein Passwort.</p>
